<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling lists using css</title>
</head>

<style>
    nav ul li{
        list-style: devnagri;
        background-color:salmon;
        list-style-position: inside;
        border: 2px solid black;
        border-radius: 5px;
        list-style-image: link;
        list-style-type: emoji;
        list-style-type: disc inside url ();
        justify-items: center;
        align-items: center;
        box-shadow: 10px 15px 8px blue;
        text-shadow: 1px 1px red;
        font-size: large;
        width: 300px;
        height: 30px;
        padding: 3px;
        margin: 2px;
        margin-left: 4px;
        padding-top: 10px;
        
        

    }

    p{

     padding: 10px;
     width: 600px;
     background-color: aqua;
     border-radius: 40px;
    font-style: italic;
    margin: 80px;
    }
</style>


<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
            <li>More</li>
        </ul>
    </nav>

    <section>
        <p>Note:Today i leran styling lists using css(lists-style,position,imageinside and more about it)</p>
    </section>
</body>
</html>
