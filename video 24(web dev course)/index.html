<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css shadows and Outlines</title>
</head>

<style>

 *{
    margin: o;
    padding: o;
 }

 .box{
    border: 2px solid black;
    border-radius: 40px;
    padding: 40px;
    margin: 40px;
    box-shadow: 15px 10px 20px 10px #888888;
    text-shadow:2px 3px yellow;
    outline: 4px solid blue;
 }

 p{
    font-size: 18px;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    font-style: italic;
    background-color: aqua;
 }
</style>


<body>

    <div class="box">
        this is a box
    </div>

    <p>Note:Today i learn css shadows and outlines properties( border,redius,outline,box shadow,text shadow)</p>    
</body>
</html>
