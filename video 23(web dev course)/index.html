<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css display property</title>
</head>

<style>
    *{
        margin: 0;
        padding: 0;
    }

    .box{
        border: 2px solid red;
        display: inline-block;
        width: 344px;
        margin: 54px;
        padding: 35px;
    }

    .box1{
     display: inline-block;
     visibility: visible;
    }

    p{
        font-size: 15px;
        background-color:black;
        color: aliceblue;
    }
</style>


<body>
    <div class="box box1">
        i am a box
    </div>

    <div class="box3">
        also a nice box
    </div>
    
    <span>i am a good boy</span>
    <span>boy</span>

    <p>Note:today i learn css display properties</p>
    
</body>
</html>
