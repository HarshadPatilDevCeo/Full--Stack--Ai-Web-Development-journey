<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css animatios</title>

    <style>
        .container{
            background-color: gray;
            height: 500px;
            width: 300px;
        }

        .box{
            background-color: aqua;
            height: 200px;
            width: 300px;
            animation-name: harshad;
            animation-duration: 3s;
        }

        @keyframes harshad{
            from{

            }

            to{
                transform: translate x(1000px);
            }
        }
    </style>


</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
    
</body>
</html>
