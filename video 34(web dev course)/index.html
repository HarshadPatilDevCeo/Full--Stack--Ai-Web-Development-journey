<style>
 img{
    width: 80px;
    height: 80px;
    float: right;

 }

 .card1{
    width: 80px;
    height: 80px;
    float: left;
    display: flow-root;
    clear:right;
 }
    

p{
    margin: 130px;
    padding: 10px;
    width: 600px
}
    

</style>


<body>
    <div class="cards">

        <div class="card2">card 2</div>
        <div class="card3">card 3</div>
        <div class="card4">card 4</div>
    </div>
    
<img src="IMG-20221206-WA0007.jpg" >
