    <title>Css flexbox</title>

<style>
.container{
    display: flex;
    flex-grow: 40px;
    justify-content: center;

    gap: 10px;

    flex-shrink: initial;
    
}
.item1{

  border: 2px solid black;

}
</style>



<body>
