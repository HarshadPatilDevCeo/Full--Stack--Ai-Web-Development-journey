<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css position property</title>
</head>

<style>
.box{
    background-color: aqua;
    color: black;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
    position: static;
    top: 200px;
    left: 30px;
}

.box1{
    background-color: brown;
    color: black;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
    top: 20px;
    left: 200px;
    position:absolute;
}
.box2{
    background-color: blue;
    color: white;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
    right: 20px;
    position: absolute;
    bottom: 2;

}

.box3{
    background-color: coral;
    color: black;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
    position: sticky;
}

.box4{
    background-color: chartreuse;
    color:black;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
}

.box5{
    background-color: cornflowerblue;
    color: azure;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
    position: fixed;

}

.box6{
    background-color: darkmagenta;
    color: black;
    height: 70px;
    width: 100vh;
    padding: 10px;
    margin: 20px;
}

p{
    background-color: chartreuse;
    margin: 50px;
    font-size: 15px;
}
</style>


<body>
    <div class="box">box</div>
    <div class="box1">box 1</div>
    <div class="box2">box 2</div>
    <div class="box3">box 3</div>
    <div class="box4">box 4</div>
    <div class="box5">box 5</div>
    <div class="box6">box 6</div>

    <p>Note: today i learn how to use (postion-static,postion-relative,position-sticky,element.style,tranform properties )</p>
</body>
</html>
