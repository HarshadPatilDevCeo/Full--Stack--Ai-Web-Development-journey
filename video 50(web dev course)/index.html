<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css filters</title>
</head>

<style>
    p img{
        height: 300px;
        width: 300px;
        filter: blur(1px );
        filter: brightness(200%);
        filter: contrast(200%);
        filter: grayscale(200%);
        filter: invert(10%);
        border-radius: 100px;
        box-shadow: 10px 20px 5px 2px blue;
        border: 3px solid red;
        padding: 20px;
        margin: 20px;
        

    }

    section img{
        filter: brightness(120%);
        border-radius: 100px; box-shadow: 10px 20px 5px 2px blue;
        padding: 20px;
        
    }
</style>


<body>
    <div class="container">
        <section><img id=hi src="IMG_20250214_134349_576.jpg"></section>
        <p><img src="New Project 58 [88A28CD].png"></p>
    </div>
    
</body>
</html>
