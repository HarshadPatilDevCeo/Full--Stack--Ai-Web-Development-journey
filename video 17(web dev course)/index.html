<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selectors </title>

<style> 

*{
    padding: 0;
    margin: 0;

}

red{
    background-color: red;
    color: black;
}

|#green{
    background-color: green;
}

div p{
    color: blue;
    background-color: brown;
}

</style>


</head>

<body>
    <red>red</red>
    <div id="green"></div>
    <div>
        <p>
            this is a normal paragraph

        </p>
    </div>

    
</body>
<p>today i learn css selectors an classes  </p>

</html>
